[package]
name = "aitierlist"
version = "0.2.1"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
blockitall-update = { git = "https://github.com/Kanrinin-sama/blockitall-update.git", rev = "4259685e327a06d1fa599d658f06dcccd00ed77a" }
csv = "1.3.1"
directories = "6.0.0"
eframe = { version = "0.36.1", features = ["persistence"] }
flate2 = "1.1.10"
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "http3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["prefer-post-quantum"] }
url = "2.5.8"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
